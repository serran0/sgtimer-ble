<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SG Timer Admin</title>
<link rel="icon" type="image/x-icon" href="img/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style-admin.css">

</head>
<body>
  <h1>SG Timer Admin Panel</h1>
  <div id="controls">
    <button id="scanBtn" class="btn">🔍 Scan</button>
    <select id="deviceSelect"></select>
    <button id="connectBtn" class="btn">🔗 Connect</button>
    <button id="disconnectBtn" class="btn btn-secondary">⛔ Disconnect</button>
    <button id="pairBtn" class="btn">🔐 Pair</button>
    <button id="unpairBtn" class="btn btn-secondary">🔓 Forget</button>
    <span id="deviceHint" class="device-hint"></span>
  </div>

  <div id="aliasRow" class="alias-row">
    <label for="aliasInput">Timer name</label>
    <input id="aliasInput" type="text" placeholder="e.g. Stage 3 — left bay" maxlength="60">
    <button id="setAliasBtn" class="btn">💾 Save name</button>
    <button id="clearAliasBtn" class="btn btn-secondary">Clear</button>
  </div>

  <!-- Pairing confirmation: mirrors the confirmation shown on the timer -->
  <div id="pairingOverlay" class="pairing-overlay" hidden>
    <div class="pairing-dialog" role="dialog" aria-modal="true" aria-labelledby="pairingTitle">
      <h2 id="pairingTitle">Confirm pairing</h2>
      <p id="pairingDevice" class="pairing-device"></p>
      <p id="pairingHint" class="pairing-hint"></p>
      <div id="pairingCode" class="pairing-code" hidden></div>
      <input id="pairingPin" class="pairing-pin" type="text" inputmode="numeric"
             placeholder="Enter the code shown on the timer" hidden>
      <p id="pairingCountdown" class="pairing-countdown"></p>
      <div class="pairing-actions">
        <button id="pairingAcceptBtn" class="btn">✅ Confirm</button>
        <button id="pairingRejectBtn" class="btn btn-secondary">✖ Reject</button>
      </div>
    </div>
  </div>

  
 <section id="titleSection">
  <h2>Main Title</h2>
  <div class="title-row">
    <input id="titleInput" type="text" placeholder="Leave blank for no title">
    <button id="setTitleBtn" class="btn">Set Title</button>
    <button id="clearTitleBtn" class="btn btn-secondary">Clear</button>
  </div>
</section>

<section id="displaySection">
  <h2>Display Text Size</h2>
  <p class="section-note">
    Percentage of the default size. The overlay stays scaled to the screen it
    is shown on, so these work on any resolution.
  </p>
  <div class="size-grid">
    <label for="titleScale">Main title</label>
    <input id="titleScale" class="size-input" type="number" min="25" max="400" step="5">
    <span class="size-unit">%</span>

    <label for="statsScale">Session stats</label>
    <input id="statsScale" class="size-input" type="number" min="25" max="400" step="5">
    <span class="size-unit">%</span>

    <label for="tickerScale">Shot / split ticker</label>
    <input id="tickerScale" class="size-input" type="number" min="25" max="400" step="5">
    <span class="size-unit">%</span>
  </div>
  <div class="size-actions">
    <button id="applySizesBtn" class="btn">Apply sizes</button>
    <button id="resetSizesBtn" class="btn btn-secondary">Reset to default</button>
  </div>
</section>


  <section id="consoleSection">
  <h2>Console</h2>
  <div id="log"></div>
  </section>

  <section id="sessionsSection">
    <div class="sessions-header">
  <h2>Past Sessions</h2>
  <div class="session-controls">
    <button id="refreshSessionsBtn" class="btn">🔄 Refresh Sessions</button>
    <button id="clearSessionsBtn" class="btn clear-btn">🗑️ Clear All Sessions</button>
  </div>
</div>
    <div id="sessionsList" class="sessions-list"></div>
    <div class="pagination">
      <button id="loadMoreBtn" class="btn">Show next 20 sessions</button>
    </div>
  </section>

  <script src="js/admin.js"></script>
</body>
</html>
