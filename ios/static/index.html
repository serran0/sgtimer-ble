<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SG Timer Display</title>
<link rel="stylesheet" href="css/style-display.css" />
<style>
  /* Camera stream fills the entire viewport as background */
  #cameraBg {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    z-index: -1;
  }
  /* Solid dark fallback when stream is unavailable */
  body { background-color: #111; }

  /* Audio mute/unmute button – bottom-right corner */
  #audioBtn {
    position: fixed;
    bottom: 14px;
    right: 14px;
    z-index: 10;
    background: rgba(0,0,0,0.45);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 50%;
    width: 38px;
    height: 38px;
    font-size: 18px;
    line-height: 38px;
    text-align: center;
    cursor: pointer;
    user-select: none;
    transition: background 0.2s;
  }
  #audioBtn:hover { background: rgba(255,255,255,0.15); }
</style>
</head>
<body class="display-page">

  <!--
    The iOS app serves a live MJPEG camera stream at /camera.
    It is used as a full-screen background behind the timer overlay.
    If the server is the Python version (no camera), the broken image
    is hidden via the onerror handler below.
  -->
  <img id="cameraBg" src="/camera" alt=""
       onerror="this.style.display='none'" />

  <!--
    Audio stream from the iOS device's microphone.
    Starts muted to satisfy browser autoplay policy; user unmutes via button.
  -->
  <audio id="audioEl" src="/audio" autoplay muted playsinline></audio>
  <button id="audioBtn" title="Unmute audio" onclick="toggleAudio()">🔇</button>

  <div id="display">
    <div id="competitionTitle">SG Timer</div>
    <div id="connectionIndicator" class="status-dot disconnected" title="Disconnected"></div>

    <div id="sessionInfo">
      <div id="firstShot">First Shot - 0.00</div>
      <div id="bestSplit">Best Split - 0.00</div>
      <div id="totalTime">Total Time - 0.00</div>
      <div id="totalShots">Total Shots - 0</div>
    </div>

    <div id="shotsContainer">
      <div id="shots"></div>
      <div class="fadeOverlay"></div>
    </div>

    <div id="status" class="stopped">STOPPED</div>
  </div>

  <script src="js/app.js"></script>
  <script>
    // ── Audio stream controls ──────────────────────────────────────
    const audioEl  = document.getElementById('audioEl');
    const audioBtn = document.getElementById('audioBtn');

    function toggleAudio() {
      if (audioEl.muted) {
        audioEl.muted = false;
        audioEl.play().catch(() => { audioEl.muted = true; });
      } else {
        audioEl.muted = true;
      }
      audioBtn.textContent = audioEl.muted ? '🔇' : '🔊';
    }

    // Reconnect audio stream if it stalls or errors
    function reconnectAudio() {
      const wasMuted = audioEl.muted;
      audioEl.src = '';
      setTimeout(() => {
        audioEl.src = '/audio';
        audioEl.muted = wasMuted;
        audioEl.play().catch(() => {});
      }, 2000);
    }

    audioEl.addEventListener('error',  reconnectAudio);
    audioEl.addEventListener('ended',  reconnectAudio);
    audioEl.addEventListener('stalled', () => {
      // Only reconnect if we actually wanted audio
      if (!audioEl.muted) reconnectAudio();
    });

    // If the audio endpoint is absent (Python server), hide the button
    audioEl.addEventListener('error', () => {
      if (audioEl.networkState === HTMLMediaElement.NETWORK_NO_SOURCE) {
        audioBtn.style.display = 'none';
      }
    }, { once: true });
  </script>
</body>
</html>
