<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>SG Timer Display</title>
<link rel="stylesheet" href="css/style-display.css" />
<style>
  #cameraBg {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    z-index: -1;
  }
  body { background-color: #111; }

  #audioBtn {
    position: fixed;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    right: calc(14px + env(safe-area-inset-right, 0px));
    z-index: 10;
    background: rgba(0,0,0,0.45);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 50%;
    width: 38px;
    height: 38px;
    font-size: 18px;
    line-height: 38px;
    text-align: center;
    cursor: pointer;
    user-select: none;
    transition: background 0.2s;
  }
  #audioBtn:hover { background: rgba(255,255,255,0.15); }
</style>
</head>
<body class="display-page">

  <!-- Camera background: src set by JS (WS blob or /camera fallback) -->
  <img id="cameraBg" alt="" onerror="this.style.display='none'" />

  <!-- HTTP audio fallback (no src; started by JS only when WS unavailable) -->
  <audio id="audioEl" playsinline></audio>
  <button id="audioBtn" title="Mute audio" onclick="toggleAudio()">&#128266;</button>

  <div id="display">
    <div id="competitionTitle">SG Timer</div>
    <div id="connectionIndicator" class="status-dot disconnected" title="Disconnected"></div>

    <div id="sessionInfo">
      <div id="firstShot">First Shot - 0.00</div>
      <div id="bestSplit">Best Split - 0.00</div>
      <div id="totalTime">Total Time - 0.00</div>
      <div id="totalShots">Total Shots - 0</div>
    </div>

    <div id="shotsContainer">
      <div id="shots"></div>
      <div class="fadeOverlay"></div>
    </div>

    <div id="status" class="stopped">STOPPED</div>
  </div>

  <!-- A/V sync delay — fetched from /get_settings on load; default 300ms -->
  <script>let AV_SYNC_DELAY_MS = 300;</script>
  <script src="js/app.js"></script>
  <script>
    // ── A/V WebSocket stream ──────────────────────────────────────────
    // Connects to /avstream (iOS server only).
    // Binary messages: byte 0 = type (0x01 JPEG video, 0x02 AAC audio), rest = payload.
    // Falls back to /camera HTTP MJPEG if the endpoint is unavailable.

    const cameraBg = document.getElementById('cameraBg');
    const audioEl  = document.getElementById('audioEl');
    const audioBtn = document.getElementById('audioBtn');

    // In the native preview overlay (?preview=1) we skip all audio to avoid
    // a feedback loop between the phone's speaker and microphone.
    const isPreview = new URLSearchParams(location.search).get('preview') === '1';
    if (isPreview) audioBtn.style.display = 'none';

    let avMuted       = false; // start unmuted
    let avWs          = null;
    let audioCtx      = null;
    let nextTime      = 0;
    let decodeChain   = Promise.resolve();
    let pendingDecodes = 0;
    const MAX_PENDING  = 3;    // drop chunks if decode is falling behind
    const MAX_AHEAD    = 1.0;  // drop chunks if scheduled >1 s in the future

    // ── Auto-resume AudioContext on any user interaction ──────────────
    // Browsers block AudioContext until a gesture has occurred. Any tap or
    // click on the page counts — the user never has to touch the mute button.
    // Key: we also CREATE the context here when it doesn't exist yet, because
    // a context created directly inside a gesture handler starts in 'running'
    // state on iOS Safari (no separate resume() call needed).
    function tryResumeAudio() {
      if (avMuted) return;
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
        nextTime = audioCtx.currentTime + 0.15;
        return; // already running — chunks will play as soon as they arrive
      }
      if (audioCtx.state !== 'running') {
        audioCtx.resume().then(() => {
          if (audioCtx) nextTime = audioCtx.currentTime + 0.15; // re-anchor schedule
        }).catch(() => {});
      }
    }
    document.addEventListener('click',      tryResumeAudio, { passive: true });
    document.addEventListener('touchstart', tryResumeAudio, { passive: true });

    function avConnect() {
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      avWs = new WebSocket(proto + '//' + location.host + '/avstream');
      avWs.binaryType = 'arraybuffer';

      avWs.onopen = () => {
        cameraBg.removeAttribute('src'); // cancel any HTTP camera fallback
      };

      avWs.onmessage = ({ data }) => {
        const buf     = new Uint8Array(data);
        const type    = buf[0];
        const payload = buf.slice(1); // copy, not a view
        if      (type === 0x01) showVideoFrame(payload);
        else if (type === 0x02 && !avMuted && !isPreview) scheduleAudio(payload);
      };

      avWs.onclose = avWs.onerror = () => {
        cameraBg.src = '/camera'; // fall back to HTTP MJPEG
        setTimeout(avConnect, 3000);
      };
    }

    // ── Delayed video display (matches audio latency) ────────────────
    const videoQueue = [];
    let rafScheduled = false;

    function showVideoFrame(jpegBytes) {
      videoQueue.push({ url: URL.createObjectURL(new Blob([jpegBytes], { type: 'image/jpeg' })),
                        ts: performance.now() });
      if (!rafScheduled) { rafScheduled = true; requestAnimationFrame(drainVideoQueue); }
    }

    function drainVideoQueue() {
      const now = performance.now();
      let showUrl = null;
      // Consume all frames old enough; keep only the newest eligible one
      while (videoQueue.length && now - videoQueue[0].ts >= AV_SYNC_DELAY_MS) {
        if (showUrl) URL.revokeObjectURL(showUrl); // discard skipped frames immediately
        showUrl = videoQueue.shift().url;
      }
      if (showUrl) {
        const prev = cameraBg.src;
        cameraBg.onload = () => { if (prev.startsWith('blob:')) URL.revokeObjectURL(prev); };
        cameraBg.src = showUrl;
        cameraBg.style.display = '';
      }
      if (videoQueue.length) requestAnimationFrame(drainVideoQueue);
      else rafScheduled = false;
    }

    function scheduleAudio(chunk) {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
        audioCtx.resume().catch(() => {}); // succeeds immediately if allowed; otherwise
        nextTime = audioCtx.currentTime + 0.15; // tryResumeAudio() handles the rest
      }
      // If context is still blocked, drop the chunk — audio will catch up once
      // the user touches the screen (handled by tryResumeAudio above).
      if (audioCtx.state !== 'running') return;
      // Drop if decode pipeline is backed up or scheduled too far ahead
      if (pendingDecodes >= MAX_PENDING) return;
      if (nextTime > audioCtx.currentTime + MAX_AHEAD) return;
      pendingDecodes++;
      const buf = chunk.buffer; // Uint8Array.slice() owns this buffer
      // Serialize decodes so out-of-order promise resolution can't corrupt nextTime
      decodeChain = decodeChain
        .then(() => audioCtx ? audioCtx.decodeAudioData(buf) : Promise.reject())
        .then(decoded => {
          pendingDecodes = Math.max(0, pendingDecodes - 1);
          if (!audioCtx) return;
          const src = audioCtx.createBufferSource();
          src.buffer = decoded;
          src.connect(audioCtx.destination);
          const now = audioCtx.currentTime;
          if (nextTime < now + 0.05) nextTime = now + 0.05;
          src.start(nextTime);
          nextTime += decoded.duration;
        })
        .catch(() => { pendingDecodes = Math.max(0, pendingDecodes - 1); });
    }

    // ── Audio toggle ──────────────────────────────────────────────────
    function toggleAudio() {
      const wsActive = avWs && avWs.readyState === WebSocket.OPEN;

      if (wsActive) {
        avMuted = !avMuted;
        if (avMuted) {
          decodeChain = Promise.resolve();
          pendingDecodes = 0;
          if (audioCtx) { audioCtx.close(); audioCtx = null; }
        }
        audioBtn.textContent = avMuted ? '🔇' : '🔊';
      } else {
        if (audioEl.muted || !audioEl.src) {
          if (!audioEl.src) audioEl.src = '/audio';
          audioEl.muted = false;
          audioEl.play().catch(() => { audioEl.muted = true; });
        } else {
          audioEl.muted = true;
        }
        audioBtn.textContent = audioEl.muted ? '🔇' : '🔊';
      }
    }

    // ── HTTP audio reconnect (fallback mode only) ─────────────────────
    function reconnectAudio() {
      if (avWs && avWs.readyState === WebSocket.OPEN) return;
      const wasMuted = audioEl.muted;
      audioEl.src = '';
      setTimeout(() => {
        audioEl.src = '/audio';
        audioEl.muted = wasMuted;
        audioEl.play().catch(() => {});
      }, 2000);
    }

    audioEl.addEventListener('error',   reconnectAudio);
    audioEl.addEventListener('ended',   reconnectAudio);
    audioEl.addEventListener('stalled', () => { if (!audioEl.muted) reconnectAudio(); });

    avConnect();
  </script>
</body>
</html>
